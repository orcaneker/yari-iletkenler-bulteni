<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arşiv — Yarı İletken Bülteni</title>
<meta name="theme-color" content="#100C08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,200..900,0..100,0..1&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>document.documentElement.className="js"+("IntersectionObserver" in window?" io":"");</script>
<style>
:root{
  --soil:#100C08; --soil-2:#171109; --line:#3A2A17;
  --leaf:#E0912E; --spore:#E8B33C;
  --text:#EDE7DD; --muted:#A99B87;
  --paper:#F7F1E6; --paper-2:#EFE6D5; --paper-card:#FDFAF3;
  --ink:#241A0F; --ink-soft:#6B5540; --line-light:#E0D3BA;
  --leaf-deep:#96501C; --amber-deep:#A66F1C;
  --f-display:"Fraunces",Georgia,serif;
  --f-body:"Instrument Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --gutter:clamp(1.25rem,4vw,4.5rem);
  --max:960px;
}
*{box-sizing:border-box;margin:0;padding:0}
/* az sayıda kayıt varken bile footer sayfanın altına otursun */
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);
  font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
.shell{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
:focus-visible{outline:2px solid var(--amber-deep);outline-offset:3px;border-radius:3px}

/* ── DOSYA CETVELİ ── */
.rail{background:var(--soil-2);color:var(--muted);font-family:var(--f-mono);
  font-size:.69rem;letter-spacing:.13em;text-transform:uppercase}
.rail-in{max-width:var(--max);margin:0 auto;padding:.55rem var(--gutter);
  display:flex;gap:1.4rem;flex-wrap:wrap}
.rail b{color:var(--leaf);font-weight:500}

/* ── KOYU BAŞLIK BANDI ── */
.top{background:var(--soil);color:var(--text);
  padding:clamp(2.6rem,7vh,4.4rem) 0 clamp(2.2rem,5vh,3.4rem);
  border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 82% 20%,rgba(155,199,126,.10),transparent 62%)}
.top .in{position:relative;z-index:1}
.ust{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.24em;
  text-transform:uppercase;color:var(--spore);margin-bottom:.7rem}
h1{font-family:var(--f-display);font-weight:700;
  font-variation-settings:"wght" 700,"SOFT" 40,"WONK" 1;
  font-size:clamp(2.2rem,6vw,3.6rem);line-height:.98;letter-spacing:-.03em}
h1 em{font-style:italic;color:var(--leaf)}
.geri{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.5rem;
  font-family:var(--f-mono);font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;transition:color .18s}
.geri:hover{color:var(--leaf)}
.top :focus-visible{outline-color:var(--spore)}

/* ── LİSTE ── */
.liste{padding:clamp(2rem,5vw,3.2rem) 0 clamp(3.5rem,8vw,5.5rem)}
.sayi{display:grid;grid-template-columns:120px 1fr auto;gap:1.4rem;align-items:center;
  padding:1.15rem 1.15rem;margin:0 -1.15rem;border-radius:14px;
  border-bottom:1px solid var(--line-light);text-decoration:none;color:var(--ink);
  transition:background .18s,transform .18s}
.sayi:hover{background:var(--paper-card);transform:translateX(4px)}
.sayi:hover h2{color:var(--leaf-deep)}
.no{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;color:var(--ink-soft)}
.no b{display:block;font-family:var(--f-display);font-size:1.35rem;color:var(--ink);
  font-weight:700;font-variation-settings:"wght" 700,"SOFT" 40,"WONK" 1;
  letter-spacing:-.02em;margin-bottom:.15rem}
.sayi h2{font-family:var(--f-display);font-weight:600;
  font-variation-settings:"wght" 600,"SOFT" 35,"WONK" 0;
  font-size:1.15rem;line-height:1.28;letter-spacing:-.012em;transition:color .18s}
.sayi .m{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;
  color:var(--ink-soft);text-align:right;white-space:nowrap;line-height:1.7}
.bos{padding:clamp(3.5rem,10vh,6rem) 0;text-align:center;font-family:var(--f-mono);
  font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
@media(max-width:640px){
  .sayi{grid-template-columns:1fr;gap:.5rem}
  .sayi .m{text-align:left}
  .no b{display:inline;margin-right:.6rem}
}

/* ── FOOTER ── */
footer{background:var(--soil);border-top:1px solid var(--line);color:var(--muted)}
.foot-in{max-width:var(--max);margin:0 auto;padding:2.2rem var(--gutter) 3rem;
  display:flex;gap:1rem 1.6rem;flex-wrap:wrap;align-items:center;
  font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase}
.foot-in a{color:var(--muted);text-decoration:none}
.foot-in a:hover{color:var(--leaf)}
.foot-in .sag{margin-left:auto;display:flex;gap:1.2rem}

.io .rv{opacity:0;transform:translateY(14px);
  transition:opacity .5s cubic-bezier(.2,.7,.25,1),transform .5s cubic-bezier(.2,.7,.25,1)}
.io .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .io .rv{opacity:1;transform:none}
}
</style>
</head>
<body>

<div class="rail"><div class="rail-in">
  <span>Dosya <b>YİB — SAYI ARŞİVİ</b></span>
</div></div>

<header class="top"><div class="shell in">
  <div class="ust">Haftalık İzleme Raporu</div>
  <h1>Arşiv <em>— geçmiş sayılar</em></h1>
  <a class="geri" href="./">← Güncel sayıya dön</a>
</div></header>

<main class="shell"><div class="liste" id="liste">
  <div class="bos">Arşiv yükleniyor…</div>
</div></main>

<footer><div class="foot-in">
  <span>Yarı İletken Bülteni</span>
  <span class="sag"><a href="./">Güncel sayı</a><a href="feed.xml">RSS</a></span>
</div></footer>

<script>
function trTarih(iso){
  if(!iso) return "—";
  const ay=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  const d=new Date(iso+"T00:00:00");
  return `${d.getDate()} ${ay[d.getMonth()]} ${d.getFullYear()}`;
}
function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML;}

fetch("data/index.json").then(r=>r.json()).then(sayilar=>{
  const el=document.getElementById("liste");
  if(!sayilar.length){ el.innerHTML='<div class="bos">Henüz yayınlanmış sayı yok.</div>'; return; }
  el.innerHTML=sayilar.map(s=>`
    <a class="sayi rv" href="./?hafta=${esc(s.hafta)}">
      <span class="no"><b>${String(s.number).padStart(3,"0")}</b>${esc(s.hafta)}</span>
      <h2>${esc(s.lead_title)}</h2>
      <span class="m">${trTarih(s.publication_date)}<br>${s.story_count} haber · ${s.radar_count} radar</span>
    </a>`).join("");

  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    el.querySelectorAll(".rv").forEach(x=>x.classList.add("in")); return;
  }
  const io=new IntersectionObserver((g,o)=>g.forEach(x=>{
    if(x.isIntersecting){ x.target.classList.add("in"); o.unobserve(x.target); }
  }),{rootMargin:"0px 0px -6% 0px"});
  el.querySelectorAll(".rv").forEach(x=>io.observe(x));
}).catch(()=>{
  document.getElementById("liste").innerHTML=
    '<div class="bos">Arşiv verisi yüklenemedi.</div>';
});
</script>
</body>
</html>
